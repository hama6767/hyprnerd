name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  validate:
    name: Validate / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-26.04, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install syntax checker
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.4 jq
      - name: Validate configuration and asset integrity
        run: python scripts/ci.py
      - name: Test installer in isolated homes
        run: python -m unittest discover -s tests -v
  foundation:
    name: Install foundation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools, LazyVim and Japanese input
        run: python3 bootstrap.py --apply --no-session
      - name: Exercise installed tools and editor
        run: python3 scripts/check-foundation.py
      - name: Check idempotent reapplication
        run: python3 bootstrap.py --apply --skip-packages --skip-plugins --no-session
  arch:
    name: Install foundation / Arch rolling
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Prepare Arch container
        run: pacman -Syu --noconfirm --needed python git ca-certificates lua zsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools, LazyVim and Japanese input
        run: python3 bootstrap.py --apply --no-session
      - name: Exercise installed tools and editor
        run: python3 scripts/check-foundation.py
      - name: Validate portable configuration
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci.py
  package:
    name: Package
    needs: [validate, foundation, arch]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build archive and checksum
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_SHA:0:12}"
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; fi
          python3 scripts/package.py --version "$version"
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyprnerd-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          python3 scripts/package.py --version "${RELEASE_TAG#v}"
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "hyprnerd $RELEASE_TAG" --generate-notes
          fi
